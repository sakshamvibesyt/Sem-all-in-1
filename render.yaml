services:
  - type: web
    name: sem-all-in-one
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: OWNER_ID
        sync: false
      - key: ABOUT_BOT_TOKEN
        sync: false
      - key: ABOUT_MONGODB_URI
        sync: false
      - key: KITTU_BOT_TOKEN
        sync: false
      - key: KITTU_MONGO_URI
        sync: false
      - key: ZYRA_BOT_TOKEN
        sync: false
      - key: ZYRA_API_ID
        sync: false
      - key: ZYRA_API_HASH
        sync: false
      - key: ZYRA_MONGO_URL
        sync: false
      - key: ZYRA_SESSION_KEY
        sync: false
      - key: KANHA_TOKEN
        sync: false
      - key: KANHA_API_ID
        sync: false
      - key: KANHA_API_HASH
        sync: false
      - key: KANHA_MONGO_DB_URI
        sync: false
      - key: KANHA_STRING_SESSIONS
        sync: false
